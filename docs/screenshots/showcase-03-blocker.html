<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - AmniHaze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #020617;
      color: #f1f5f9;
      padding: 30px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(16, 185, 129, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      text-align: center;
      padding: 40px 36px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      backdrop-filter: blur(20px);
    }
    .shield-icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.25) inset, 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      margin-bottom: 10px;
    }
    .blocked-url {
      font-size: 15px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: inline-block;
      margin-bottom: 24px;
      font-family: monospace;
    }
    .quote-box {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }
    .quote-text {
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
      font-style: italic;
      margin-bottom: 8px;
    }
    .quote-author {
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
    }
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      flex: 1;
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield-icon-wrapper">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      PROTECTION SHIELD ACTIVE
    </div>
    <h1>Site Blocked</h1>
    <div class="blocked-url">distraction-site.example.com</div>
    
    <div class="quote-box">
      <div class="quote-text">"He who conquers himself is the mightiest warrior. Protect your peace and focus on what truly matters."</div>
      <div class="quote-author">— Amni Focus Guard</div>
    </div>
    
    <div class="btn-row">
      <button class="btn-primary">Return to Productivity</button>
      <button class="btn-secondary">Unblock Cooldown (60s)</button>
    </div>
  </div>
</body>
</html>
