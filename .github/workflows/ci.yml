name: Test, Build & Publish AmniHaze Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. RIGOROUS TESTING & VALIDATION PHASE (Quality Gate)
  # =========================================================================
  test-and-validate:
    name: 🧪 Rigorous Automated Testing & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Extension Artifacts
        run: npm run build

      - name: Run Full Automated Test Suite (9 Verification Suites)
        run: npm test

      - name: Verify Build Output Integrity
        run: |
          if [ ! -f build/chrome/manifest.json ] || [ ! -f build/firefox/manifest.json ]; then
            echo "❌ Error: Browser manifest builds are incomplete!"
            exit 1
          fi
          echo "✅ AmniHaze build and test validation succeeded."

  # =========================================================================
  # 2. BUILD, RELEASE & STORE SUBMISSION PHASE (Gated by Test Success)
  # =========================================================================
  publish-and-release:
    name: 🚀 Build Release & Auto-Submit to Edge Add-ons
    needs: [test-and-validate]
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Extension Artifacts
        run: npm run build

      - name: Create Production Distribution Packages
        run: npm run dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amnihaze-extension-zips
          path: dist/*.zip

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.1' }}
          name: AmniHaze Extension ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.2.1' }}
          body: |
            ## 👁️ AmniHaze Visual AI Content Protection Extension v0.2.1
            - **Local Machine Learning**: Real-time on-device screen blur and video masking engine.
            - **100% Zero-Knowledge Privacy**: Inference executes completely locally in-browser via TensorFlow.js / LiteRT.
            - **Store Packages**: Signed and verified packages for Chrome, Edge, and Firefox.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Microsoft Edge Add-ons
        uses: wdzeng/edge-addon@v2
        continue-on-error: true
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID || secrets.EDGE_EXTENSION_ID || secrets.PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID || secrets.CLIENT_ID }}
          api-key: ${{ secrets.Key_1 || secrets.KEY_1 || secrets.EDGE_KEY_1 || secrets.EDGE_API_KEY || secrets.EDGE_CLIENT_SECRET }}
          zip-path: dist/amnihaze-Edge.zip
          notes-for-certification: "Automated release update for AmniHaze visual AI content protection extension passing all automated test suites."
