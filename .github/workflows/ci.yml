name: Build & Release AmniHaze Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Extension
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Create Distribution Package
        run: npm run dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amngaze-extension-zips
          path: dist/*.zip

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.9' }}
          name: AmniHaze Extension ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.9' }}
          body: |
            ## 👁️ AmniHaze Visual AI Content Protection Extension v0.1.9
            - **Local Machine Learning**: Real-time TensorFlow Lite screen blur engine.
            - **Cross-Browser Package**: Chrome & Firefox extension builds.
          draft: false
          prerelease: false
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
